<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; upgrade-insecure-requests;">
  <title>Lost · Sarah &amp; Alex</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/shared.v2.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; align-items: center; justify-content: center; }
    .msg {
      position: relative; z-index: 1;
      text-align: center;
      color: var(--gold);
      font-size: 11px;
      line-height: 2.5;
      text-shadow: 3px 3px 0 #5a2800;
      padding: 20px;
      max-width: 520px;
    }
    .msg h1 { font-size: inherit; font-weight: normal; }
    .msg span {
      display: block;
      font-size: 7px;
      color: var(--parchment);
      opacity: .7;
      margin-top: 16px;
      letter-spacing: 2px;
      line-height: 2.4;
    }
    .msg a {
      display: inline-block;
      margin-top: 20px;
      color: var(--green);
      font-size: 8px;
      text-decoration: none;
      letter-spacing: 2px;
      border: 3px solid var(--wood-border);
      background: var(--wood-dark);
      padding: 10px 14px;
      box-shadow: inset 3px 3px 0 var(--wood-hi), inset -3px -3px 0 #0a0500;
    }
    .msg a:hover, .msg a:focus-visible { color: var(--parchment); outline: 3px solid var(--gold); outline-offset: 2px; }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

  <div id="sky" data-stars="120"></div>

  </div>
  <script src="/assets/js/stars.js"></script>
</body>
</html>
